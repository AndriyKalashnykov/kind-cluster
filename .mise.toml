# Pinned tool versions — single source of truth for local dev and CI.
# Renovate's native mise manager tracks these (both core and aqua backends).
# Docker-image-pinned tools (mermaid-cli, plantuml) stay in Makefile, as does
# KUBECTL_VERSION which doubles as a Dockerfile --build-arg for images/Dockerfile.
[tools]
"aqua:koalaman/shellcheck"  = "0.11.0"
"aqua:rhysd/actionlint"     = "1.7.12"
"aqua:gitleaks/gitleaks"    = "8.30.1"
"aqua:aquasecurity/trivy"   = "0.74.0"
"aqua:hadolint/hadolint"    = "2.15.1"
"aqua:nektos/act"           = "0.2.89"
"aqua:bats-core/bats-core"  = "1.14.0"
# jq and kubectl need a renovate.json packageRule each: Renovate's mise manager looks
# an `aqua:<owner>/<repo>` tool up as github-tags on <owner>/<repo> with extractVersion
# `^v?`, which finds nothing for jq (tags are `jq-1.8.2`) or kubectl (kubernetes/kubectl
# tags are `v0.37.1` / `kubernetes-1.37.1`). See the two mise rules in renovate.json.
"aqua:jqlang/jq"            = "1.8.2"
"aqua:kubernetes-sigs/kind" = "0.33.0"
"aqua:kubernetes/kubectl"   = "1.37.1"
